apiVersion: descheduler/v1alpha2
kind: DeschedulerPolicy
profiles:
- name: CompactAndScale
  pluginConfig:
  - args:
      evictableNamespaces:
        exclude:
        - kube-system
        - hypershift
        - openshift
        - openshift-kube-descheduler-operator
        - openshift-kube-scheduler
        - kube-system
        - openshift-*
      thresholds:
        cpu: 10
        memory: 10
        pods: 10
    name: HighNodeUtilization
  - args:
      evictLocalStoragePods: true
      podProtections: {}
      priorityThreshold:
        name: ""
        value: 500
    name: DefaultEvictor
  plugins:
    balance:
      disabled: null
      enabled:
      - HighNodeUtilization
    deschedule:
      disabled: null
      enabled: null
    filter:
      disabled: null
      enabled:
      - DefaultEvictor
    preevictionfilter:
      disabled: null
      enabled: null
    presort:
      disabled: null
      enabled: null
    sort:
      disabled: null
      enabled: null
