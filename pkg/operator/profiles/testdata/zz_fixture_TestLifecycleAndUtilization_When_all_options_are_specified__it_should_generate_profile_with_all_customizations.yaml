apiVersion: descheduler/v1alpha2
kind: DeschedulerPolicy
profiles:
- name: LifecycleAndUtilization
  pluginConfig:
  - args:
      maxPodLifeTimeSeconds: 300
      namespaces:
        exclude:
        - kube-system
        - hypershift
        - openshift
        - openshift-kube-descheduler-operator
        - openshift-kube-scheduler
        - kube-system
        - openshift-*
    name: PodLifeTime
  - args:
      includingInitContainers: true
      namespaces:
        exclude:
        - kube-system
        - hypershift
        - openshift
        - openshift-kube-descheduler-operator
        - openshift-kube-scheduler
        - kube-system
        - openshift-*
      podRestartThreshold: 100
    name: RemovePodsHavingTooManyRestarts
  - args:
      evictableNamespaces:
        exclude:
        - kube-system
        - hypershift
        - openshift
        - openshift-kube-descheduler-operator
        - openshift-kube-scheduler
        - kube-system
        - openshift-*
      targetThresholds:
        cpu: 30
        memory: 30
        pods: 30
      thresholds:
        cpu: 10
        memory: 10
        pods: 10
    name: LowNodeUtilization
  - args:
      evictLocalStoragePods: true
      podProtections: {}
      priorityThreshold:
        name: ""
        value: 500
    name: DefaultEvictor
  plugins:
    balance:
      disabled: null
      enabled:
      - LowNodeUtilization
    deschedule:
      disabled: null
      enabled:
      - PodLifeTime
      - RemovePodsHavingTooManyRestarts
    filter:
      disabled: null
      enabled:
      - DefaultEvictor
    preevictionfilter:
      disabled: null
      enabled: null
    presort:
      disabled: null
      enabled: null
    sort:
      disabled: null
      enabled: null
