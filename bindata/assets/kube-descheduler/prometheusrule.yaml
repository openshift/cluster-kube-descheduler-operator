---
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: descheduler-rules
  namespace: openshift-kube-descheduler-operator
spec:
  groups:
    - name: recordingRules.rules
      interval: 30s
      rules:
        # Base metrics (CPU and Memory utilization)
        - record: descheduler:nodeutilization:cpu:avg1m
          expr: avg by (instance) (1 - rate(node_cpu_seconds_total{mode='idle'}[1m]))

        - record: descheduler:averageworkersutilization:cpu:avg1m
          expr: avg(descheduler:nodeutilization:cpu:avg1m * on(instance) group_left(node) label_replace(kube_node_role{role="worker"}, 'instance', "$1", 'node', '(.+)'))

        - record: descheduler:nodeutilization:memory:avg1m
          expr: |-
            (
              1 - avg_over_time(node_memory_MemAvailable_bytes[1m]) /
              on(instance) label_replace(kube_node_status_allocatable{resource="memory"}, 'instance', "$1", 'node', '(.+)')
            ) and on(instance)
            label_replace(kube_node_status_allocatable{resource="memory"}, 'instance', "$1", 'node', '(.+)') > 0

        - record: descheduler:averageworkersutilization:memory:avg1m
          expr: avg(descheduler:nodeutilization:memory:avg1m * on(instance) group_left(node) label_replace(kube_node_role{role="worker"}, 'instance', "$1", 'node', '(.+)'))

        # Pressure metrics
        - record: descheduler:nodepressure:cpu:avg1m
          # return the cpu pressure if the cpu usage is over 70% otherwise
          # return cpu pressure as zero to (partially) filter out false
          # positives pressure spikes due to CPU limited pods.
          # See: https://github.com/kubernetes/enhancements/issues/5062
          # Ideally, PSI pressure per container (see:
          # https://github.com/kubernetes/kubernetes/pull/130701 ) combined
          # with a quantile aggregation would better filter out outlier pods
          # driving pressure spikes, but per-container PSI is not yet available.
          expr: |-
            (
              avg by (instance) (rate(node_pressure_cpu_waiting_seconds_total[1m]))
              and
              (1 - avg by (instance) (rate(node_cpu_seconds_total{mode='idle'}[1m]))) > 0.7
            )
            or
            (avg by (instance) (rate(node_pressure_cpu_waiting_seconds_total[1m])) * 0)

        - record: descheduler:averageworkerspressure:cpu:avg1m
          expr: avg(descheduler:nodepressure:cpu:avg1m * on(instance) group_left(node) label_replace(kube_node_role{role="worker"}, 'instance', "$1", 'node', '(.+)'))

        - record: descheduler:nodepressure:memory:avg1m
          # return the memory pressure if the memory usage is over 70% otherwise
          # return memory pressure as zero to (partially) filter out false
          # positives pressure spikes due to memory limited pods.
          # Ideally, PSI pressure per container (see:
          # https://github.com/kubernetes/kubernetes/pull/130701 ) combined
          # with a quantile aggregation would better filter out outlier pods
          # driving pressure spikes, but per-container PSI is not yet available.
          expr: |-
            (
              avg by (instance) (rate(node_pressure_memory_waiting_seconds_total[1m]))
              and
              descheduler:nodeutilization:memory:avg1m > 0.7
            )
            or
            (avg by (instance) (rate(node_pressure_memory_waiting_seconds_total[1m])) * 0)

        - record: descheduler:averageworkerspressure:memory:avg1m
          expr: avg(descheduler:nodepressure:memory:avg1m * on(instance) group_left(node) label_replace(kube_node_role{role="worker"}, 'instance', "$1", 'node', '(.+)'))

        - record: descheduler:combined_utilization_and_pressure:avg1m
          expr: |-
            (descheduler:nodeutilization:cpu:avg1m and on() descheduler:averageworkersutilization:cpu:avg1m < 0.8)
            or
            (descheduler:nodepressure:cpu:avg1m)

        - record: descheduler:averageworkersutilization:memory:avg1m
          expr: avg(descheduler:nodeutilization:memory:avg1m * on(instance) group_left(node) label_replace(kube_node_role{role="worker"}, 'instance', "$1", 'node', '(.+)'))

        - record: descheduler:nodeutilization:memory:avg1m:positivedeviation
          expr: |-
            descheduler:nodeutilization:memory:avg1m - on() group_left() descheduler:averageworkersutilization:memory:avg1m
            and
            descheduler:nodeutilization:memory:avg1m - on() group_left() descheduler:averageworkersutilization:memory:avg1m >= 0
            or
            descheduler:nodeutilization:memory:avg1m * 0

        - record: descheduler:nodeutilization:cpu:avg1m:positivedeviation
          expr: |-
            descheduler:nodeutilization:cpu:avg1m - on() group_left() descheduler:averageworkersutilization:cpu:avg1m
            and
            descheduler:nodeutilization:cpu:avg1m - on() group_left() descheduler:averageworkersutilization:cpu:avg1m >= 0
            or
            descheduler:nodeutilization:cpu:avg1m * 0

        - record: descheduler:nodepressure:cpu:avg1m:positivedeviation
          expr: |-
            descheduler:nodepressure:cpu:avg1m - on() group_left() descheduler:averageworkerspressure:cpu:avg1m
            and
            descheduler:nodepressure:cpu:avg1m - on() group_left() descheduler:averageworkerspressure:cpu:avg1m >= 0
            or
            descheduler:nodepressure:cpu:avg1m * 0

        - record: descheduler:nodepressure:memory:avg1m:positivedeviation
          expr: |-
            descheduler:nodepressure:memory:avg1m - on() group_left() descheduler:averageworkerspressure:memory:avg1m
            and
            descheduler:nodepressure:memory:avg1m - on() group_left() descheduler:averageworkerspressure:memory:avg1m >= 0
            or
            descheduler:nodepressure:memory:avg1m * 0

        # Ideal Point Positive Distance (Euclidean distance from ideal using positive deviations)
        - record: descheduler:node:ideal_point_positive_distance:avg1m
          expr: |-
            sqrt(
              descheduler:nodeutilization:cpu:avg1m:positivedeviation ^ 2 +
              descheduler:nodepressure:cpu:avg1m:positivedeviation ^ 2 +
              descheduler:nodeutilization:memory:avg1m:positivedeviation ^ 2 +
              descheduler:nodepressure:memory:avg1m:positivedeviation ^ 2
            )

        # Linear Amplified Ideal Point Positive Distance (k=3.0) - Amplified by 3x, clamped to [0,1]
        - record: descheduler:node:linear_amplified_ideal_point_positive_distance:k3:avg1m
          expr: |-
            clamp_max(
              3 * descheduler:node:ideal_point_positive_distance:avg1m,
              1.0
            )

        # Stable per-dimension deviations: p66 over 5m
        # quantile_over_time applied per-dimension BEFORE the Euclidean distance so that
        # the squaring step does not amplify transient single-dimension spikes.
        # Asynchronous per-dimension noise (CPU spike in minute 1, memory spike in minute 3)
        # is filtered independently; applying the quantile only to the final distance would
        # leave such spikes partially visible after squaring.
        - record: descheduler:nodeutilization:cpu:p66_5m:positivedeviation
          expr: quantile_over_time(0.66, descheduler:nodeutilization:cpu:avg1m:positivedeviation[5m])

        - record: descheduler:nodepressure:cpu:p66_5m:positivedeviation
          expr: quantile_over_time(0.66, descheduler:nodepressure:cpu:avg1m:positivedeviation[5m])

        - record: descheduler:nodeutilization:memory:p66_5m:positivedeviation
          expr: quantile_over_time(0.66, descheduler:nodeutilization:memory:avg1m:positivedeviation[5m])

        - record: descheduler:nodepressure:memory:p66_5m:positivedeviation
          expr: quantile_over_time(0.66, descheduler:nodepressure:memory:avg1m:positivedeviation[5m])

        # Stable Euclidean distance using noise-filtered per-dimension deviations
        - record: descheduler:node:ideal_point_positive_distance:p66_5m
          expr: |-
            sqrt(
              descheduler:nodeutilization:cpu:p66_5m:positivedeviation ^ 2 +
              descheduler:nodepressure:cpu:p66_5m:positivedeviation ^ 2 +
              descheduler:nodeutilization:memory:p66_5m:positivedeviation ^ 2 +
              descheduler:nodepressure:memory:p66_5m:positivedeviation ^ 2
            )

        # Stable Linear Amplified Ideal Point Positive Distance (k=3.0)
        - record: descheduler:node:linear_amplified_ideal_point_positive_distance:k3:p66_5m
          expr: |-
            clamp_max(
              3 * descheduler:node:ideal_point_positive_distance:p66_5m,
              1.0
            )

        # Track successful eviction by LowNodeUtilization strategy count per node in the last 10 minutes
        - record: descheduler:node:eviction_count:10m
          expr: |-
            label_replace(
              sum by (node) (increase(descheduler_pods_evicted_total{strategy="LowNodeUtilization", result="success"}[10m])),
              'instance', "$1", 'node', '(.+)'
            ) or on (instance)
            descheduler:nodeutilization:cpu:avg1m * 0

        # Calculate the Dampening Factor (Multiplier)
        # We use a linear decay: each eviction reduces the score by 10%.
        # 10 evictions in 10m will effectively "mute" the node (multiplier close to 0).
        - record: descheduler:node:cooldown_multiplier:10m
          expr: |-
            clamp_min(
              1 - (descheduler:node:eviction_count:10m * 0.10),
              0.01
            )

        # Actuation Priority: Stable Distance x Cooldown x Target Availability.
        # Nodes recently touched or unable to improve VM placement are
        # deprioritized, allowing other sources to be considered. Retain the
        # target-fit multiplier for two descheduling intervals so evaluation
        # jitter or a brief Prometheus restart cannot drop it for one cycle.
        - record: descheduler:node:actuation_priority:p66_5m
          expr: |-
            descheduler:node:linear_amplified_ideal_point_positive_distance:k3:p66_5m
            * on(instance) descheduler:node:cooldown_multiplier:10m
            * on(instance) (
              last_over_time(
                descheduler:node:target_availability_multiplier:10cycles[${TARGET_FIT_DAMPENING_LOOKBACK_SECONDS}s]
              )
              or on(instance)
              (descheduler:nodeutilization:cpu:avg1m * 0 + 1)
            )

    # Evaluate this group once per configured descheduling interval. This turns
    # raw per-VM blocks into at most one source-node observation per interval.
    # Producer contract: KubevirtMigrationAware exposes
    # descheduler_kubevirt_eviction_blocks_total with reason="no_eligible_target"
    # and a source-node `node` label.
    #
    # The observation range must contain enough Prometheus scrapes for
    # increase() to see a counter change. Very short descheduling intervals can
    # therefore miss observations; the normal operator interval is much longer
    # than the scrape interval.
    - name: kubevirtTargetFitDampening.rules
      interval: ${DESCHEDULING_INTERVAL_SECONDS}s
      rules:
        # Older KubeVirt plugin versions do not expose this metric; the
        # fallback yields zero for every node in that case.
        - record: descheduler:node:no_eligible_target_seen:interval
          expr: |-
            label_replace(
              clamp_max(
                sum by (node) (
                  increase(descheduler_kubevirt_eviction_blocks_total{reason="no_eligible_target"}[${DESCHEDULING_INTERVAL_SECONDS}s])
                ),
                1
              ),
              'instance', "$1", 'node', '(.+)'
            ) or on (instance)
            label_replace(
              descheduler:nodeutilization:cpu:avg1m * 0,
              'node', "$1", 'instance', '(.+)'
            )

        # Count source-node observations over the last ten configured
        # descheduling intervals. This is window-based rather than exactly
        # phase-aligned with descheduler cycles.
        - record: descheduler:node:no_eligible_target_count:10cycles
          expr: |-
            sum_over_time(
              descheduler:node:no_eligible_target_seen:interval[${TARGET_FIT_DAMPENING_WINDOW_SECONDS}s]
            )

        # Each observed blocked interval reduces priority by 10%, capped at a
        # 50% penalty so that a node with some movable VMs is not muted.
        - record: descheduler:node:target_availability_multiplier:10cycles
          expr: |-
            clamp_min(
              1 - (descheduler:node:no_eligible_target_count:10cycles * 0.10),
              0.50
            )
