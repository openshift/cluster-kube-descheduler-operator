# Allow all egress and required ingress for the descheduler operand pods.
#
# Egress is needed for:
# - DNS resolution via openshift-dns
# - Kubernetes API server communication (list/watch pods, nodes, evictions)
# - Prometheus (profiles that use Prometheus as a metrics provider)
#
# Ingress is needed for:
# - Prometheus metrics scraping on port 10258 (from monitoring namespaces)
# - Kubelet probes (work despite source restriction because kubelet runs in
#   host network, which is typically exempt from NetworkPolicy enforcement by
#   CNI plugins like OVN-Kubernetes)
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-all-egress-and-metrics-ingress-operand
  namespace: openshift-kube-descheduler-operator
  annotations:
    include.release.openshift.io/self-managed-high-availability: "true"
    include.release.openshift.io/single-node-developer: "true"
spec:
  podSelector:
    matchLabels:
      app: descheduler
  egress:
  - {}
  ingress:
  # Allow metrics scraping from monitoring namespaces
  - from:
    - namespaceSelector:
        matchLabels:
          openshift.io/cluster-monitoring: "true"
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: openshift-monitoring
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: openshift-user-workload-monitoring
    ports:
    - protocol: TCP
      port: 10258
  policyTypes:
  - Ingress
  - Egress
